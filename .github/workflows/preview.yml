# Static HTTPS preview of this branch, so browser microphone permissions behave normally.
# GitHub Pages serves one file and has no part in message transport: the page's CSP sets
# connect-src 'none', and the app contains no fetch, WebSocket, WebRTC or telemetry code.
#
# `publish` stays red until GitHub Pages is enabled once in Settings -> Pages; neither this
# workflow's token nor the branch can turn it on. `verify` is independent of that and must
# always pass.
name: preview

on:
  push:
    branches: ['claude/io-note-measured-results-ga9zqe']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the single-file app from src/
        run: npm run build
      - name: Refuse to publish a build that differs from the committed one
        run: git diff --exit-code dist/io-note.html docs/
      - name: Protocol, modem and integration tests
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
